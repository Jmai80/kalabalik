<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221a4e">
  <title>Kalabalik – öva</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="ova.js"></script>
</head>
<body class="mobil">
  <button id="ljudknapp" class="ikonknapp hornknapp" type="button" aria-label="Ljud av eller på">🔊</button>

  <main>
    <section id="valj" class="anslut">
      <a class="diskret tillbaka" href="./">← Tillbaka</a>
      <h1 class="ovarubrik">Öva på egen hand</h1>
      <p class="undertext">Prova utmaningarna utan att vara med i ett rum. Poängen sparas inte.</p>

      <fieldset class="falt">
        <legend>Hur gammal är du?</legend>
        <div class="gruppval">
          <label><input type="radio" name="grupp" value="liten"><span><b>🐣</b>5–7 år</span></label>
          <label><input type="radio" name="grupp" value="mellan" checked><span><b>🦊</b>8–12 år</span></label>
          <label><input type="radio" name="grupp" value="stor"><span><b>🦉</b>13+ år</span></label>
        </div>
      </fieldset>

      <div id="ovalista" class="ovalista"></div>
    </section>

    <section id="intro" hidden>
      <div id="introkort" class="introkort"></div>
    </section>

    <section id="spel" hidden>
      <div id="spelyta" class="spelyta"></div>
    </section>

    <section id="klar" hidden>
      <div class="mitten">
        <div id="resultatkort" class="lapp resultatkort"></div>
        <div class="ovaknappar">
          <button id="igen" class="knapp mint stor" type="button">Igen!</button>
          <button id="annan" class="knapp krita" type="button">Välj en annan</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
